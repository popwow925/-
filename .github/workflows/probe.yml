name: Probe maven
on:
  push:
    paths: ['ci/probe.txt']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch metadata
        run: |
          mkdir -p out
          for a in geckoview geckoview-omni geckoview-arm64-v8a geckoview-armeabi-v7a geckoview-x86_64; do
            echo "== $a" >> out/probe.txt
            curl -s -m 30 -w "\nHTTP %{http_code}\n" "https://maven.mozilla.org/maven2/org/mozilla/geckoview/$a/maven-metadata.xml" | grep -E "latest|release|HTTP|<version>13[0-9]|<version>14[0-9]|<version>15[0-9]" | tail -12 >> out/probe.txt
          done
          cat out/probe.txt
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ci/publish.sh ci-probe out/probe.txt
