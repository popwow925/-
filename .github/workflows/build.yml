name: Build APK and capture screenshots

on:
  push:
    branches: [aura-tv-launcher]
  workflow_dispatch:

# 需要写权限,用来把日志 / APK / 截图推到 aura-ci-* 分支
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APKs
        run: |
          set -o pipefail
          mkdir -p out
          gradle assembleDebug assembleRelease --no-daemon --stacktrace 2>&1 | tee out/build.log

      - uses: actions/upload-artifact@v4
        with:
          name: aura-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk

      - name: Publish build output
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out/apk
          cp app/build/outputs/apk/release/*.apk out/apk/ 2>/dev/null || true
          bash ci/publish.sh aura-ci-build out

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: aura-apk
          path: apk

      - name: Build a harmless stub APK (used to demo the built-in apps section)
        continue-on-error: true
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          AJ=$(ls "$ANDROID_HOME"/platforms/android-*/android.jar | sort -V | tail -1)
          echo "build-tools: $BT"; echo "android.jar: $AJ"
          mkdir -p stub-out
          "$BT/aapt2" link -o stub-out/unsigned.apk --manifest ci/stub/AndroidManifest.xml \
            -I "$AJ" --min-sdk-version 28 --target-sdk-version 34
          keytool -genkeypair -keystore stub-out/stub.jks -storepass android -keypass android \
            -alias k -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=stub"
          "$BT/apksigner" sign --ks stub-out/stub.jks --ks-pass pass:android \
            --out stub-out/demo.apk stub-out/unsigned.apk
          ls -la stub-out

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on Android TV emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: android-tv
          arch: x86
          profile: tv_1080p
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash ci/shoot.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aura-screenshots
          path: shots/

      - name: Publish screenshots
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ci/publish.sh aura-ci-shots shots
