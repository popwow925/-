name: EririLily APK release

on:
  workflow_run:
    workflows: ["Build CI"]
    types: [completed]
    branches: [eririlily-android]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build CI run id"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download APKs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: |
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -D out
          mkdir apk
          cp out/"debug apk (arm64)"/*.apk "apk/EririLily-Android-arm64.apk"
          cp out/"debug apk (all)"/*.apk "apk/EririLily-Android-通用版.apk"
          ls -la apk
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          tag="android-$(date -u +%Y%m%d)-${SHA:0:7}"
          gh release delete "$tag" -R "$GITHUB_REPOSITORY" -y --cleanup-tag 2>/dev/null || true
          gh release create "$tag" apk/*.apk -R "$GITHUB_REPOSITORY" --prerelease --target "$SHA" \
            --title "樱梨启动器 安卓版（测试版）$tag" \
            --notes "基于 Zalith Launcher 2 的非官方修改版（GPL-3.0），与 Zalith 官方无关。arm64 适合绝大多数手机；通用版包含所有架构。"
