name: Screenshots

on:
  push:
    branches: ["ci/**"]
    paths:
      - "App/**"
      - "Sources/**"
      - "tools/take_screenshots.py"
      - ".github/workflows/screenshots.yml"

jobs:
  screenshots:
    name: Simulator screenshots (real app)
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build (Debug, simulator)
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild build -project FrenemyIsle.xcodeproj -scheme FrenemyIsleApp \
            -configuration Debug -sdk iphonesimulator -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -20
      - name: Take screenshots
        run: python3 tools/take_screenshots.py build/Build/Products/Debug-iphonesimulator/FrenemyIsle.app shots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
      - name: Publish screenshots to the screenshots-output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan screenshots-output
          git rm -rfq --cached .
          git clean -fdxq -e shots
          git add shots
          git commit -qm "Simulator screenshots for ${GITHUB_SHA}"
          git push -f origin screenshots-output

