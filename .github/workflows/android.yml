name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  core:
    name: Go core (tests + Android/Windows builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: core/go.sum
      - name: Vet and test
        working-directory: core
        env:
          GOFLAGS: -mod=mod
        run: |
          set -o pipefail
          { go vet ./... && GOOS=android GOARCH=arm64 go vet ./... && go test ./mc ./app; } 2>&1 | tee ../core.log
      - name: Build
        working-directory: core
        env:
          GOFLAGS: -mod=mod
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../out
          GOOS=android GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../out/liberirilily_core.so .
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-H windowsgui -s -w" -o ../out/EririLily.exe .
      - name: Push core log (failures)
        if: failure()
        run: |
          mkdir -p logs && cp core.log logs/ 2>/dev/null || true
          cd logs && git init -q -b ci-logs && git add -A
          git -c user.name=ci -c user.email=ci@noreply commit -qm "core log ${GITHUB_SHA:0:7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY" ci-logs
      - uses: actions/upload-artifact@v4
        with:
          name: core
          path: out/

  apk:
    name: APK
    needs: [core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: core
          path: out
      - name: Core binary
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp out/liberirilily_core.so android/app/src/main/jniLibs/arm64-v8a/
          chmod +x android/app/src/main/jniLibs/arm64-v8a/liberirilily_core.so
      - name: NDK for the game runtime
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;25.2.9519653" > /dev/null
          ls "$ANDROID_SDK_ROOT/ndk"
      - name: Build APK
        working-directory: android
        env:
          EL_KEYSTORE: ${{ secrets.EL_KEYSTORE_B64 != '' && 'release.jks' || '' }}
          EL_KEYSTORE_PASSWORD: ${{ secrets.EL_KEYSTORE_PASSWORD }}
          EL_KEY_ALIAS: ${{ secrets.EL_KEY_ALIAS }}
          EL_KEY_PASSWORD: ${{ secrets.EL_KEY_PASSWORD }}
        run: |
          if [ -n "${{ secrets.EL_KEYSTORE_B64 }}" ]; then echo "${{ secrets.EL_KEYSTORE_B64 }}" | base64 -d > app/release.jks; fi
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee ../build.log
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk ../dist/EririLily-android-arm64.apk
          ls -la ../dist
      - name: Push build log (failures)
        if: failure()
        run: |
          mkdir -p logs && cp build.log logs/ 2>/dev/null || true
          grep -nE "error:|e: |FAILURE|What went wrong|Exception|undefined reference|fatal error" build.log | head -300 > logs/errors.txt || true
          cd logs && git init -q -b ci-logs && git add -A
          git -c user.name=ci -c user.email=ci@noreply commit -qm "apk build log ${GITHUB_SHA:0:7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY" ci-logs
      - uses: actions/upload-artifact@v4
        with:
          name: EririLily-android
          path: dist/*.apk
      - name: Pre-release (test build)
        if: github.event_name == 'push' && github.ref == 'refs/heads/eririlily-v2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v2-android-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}"
          gh release create "$tag" dist/*.apk -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "樱梨启动器 安卓版 v2（测试版）$tag" \
            --notes "EririLily 自己的核心与界面；游戏运行层与渲染器来自 Zalith Launcher 2（GPL-3.0）。仅支持 64 位 ARM 手机。"
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.apk out/EririLily.exe --title "EririLily ${GITHUB_REF_NAME}" --notes "安卓版 + Windows 版" || gh release upload "${GITHUB_REF_NAME}" dist/*.apk --clobber
