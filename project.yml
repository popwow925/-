# XcodeGen spec — run `xcodegen generate` in this folder (brew install xcodegen), then open FrenemyIsle.xcodeproj.
# If you prefer not to use XcodeGen, README.md lists the manual Xcode steps (they produce the same result).
name: FrenemyIsle
options:
  bundleIdPrefix: com.example          # TODO: replace with your reverse-DNS prefix
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  FrenemyIsle:
    path: .
targets:
  FrenemyIsleApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - Info.plist        # referenced through INFOPLIST_FILE, must not be copied as a resource
    dependencies:
      - package: FrenemyIsle
        product: FrenemyCore
      - package: FrenemyIsle
        product: FrenemyDemo
    settings:
      base:
        PRODUCT_NAME: FrenemyIsle
        PRODUCT_BUNDLE_IDENTIFIER: com.example.frenemyisle      # TODO
        DEVELOPMENT_TEAM: ""                                     # TODO: your Apple Developer Team ID
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"                            # iPhone + iPad
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  # Tests live in the Swift package (Tests/FrenemyCoreTests): run them with `swift test` on a Mac,
  # or in Xcode: open Package.swift, select the FrenemyIsle scheme, Product > Test.
